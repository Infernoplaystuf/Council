# Shared settings — identical for both nodes. Only nodes/<id>.yaml may differ,
# and only in node_id / news (quant_duel.config.check_identical enforces it).

seed: 20261009

universe:
  benchmark: SPY
  context: [SPY, QQQ]
  tickers: [AAPL, MSFT, NVDA, AMZN, GOOGL, META, AVGO, TSLA, BRK-B, JPM,
            V, UNH, XOM, LLY, JNJ, MA, PG, HD, COST, MRK,
            ABBV, CVX, PEP, KO, WMT, BAC, ADBE, CRM, CSCO, ORCL,
            MCD, TMO, ABT, ACN, LIN, DIS, NKE, INTC, QCOM, TXN,
            SPY, QQQ]

data:
  source: yfinance          # yfinance | synthetic
  history_start: "2015-01-01"
  dir: data

features:
  return_lookbacks: [1, 5, 10, 20, 60]
  ma_windows: [10, 50, 200]
  vol_windows: [10, 20, 60]
  rsi_window: 14
  volume_z_window: 20
  enabled:                  # feature-group on/off flags (the tuner may toggle)
    returns: true
    ma_ratio: true
    volatility: true
    rsi: true
    volume_z: true
    day_of_week: true
    spy_context: true

model:
  kind: logistic            # always_up | persistence | logistic | boosting
  params:
    logistic: {C: 0.1, max_iter: 500}
    boosting: {max_depth: 3, learning_rate: 0.05, max_iter: 200,
               min_samples_leaf: 200, l2_regularization: 1.0,
               backend: auto}       # auto (LightGBM if installed) | lightgbm | sklearn

backtest:
  train_days: 756           # ~3 years of trading days
  test_days: 21             # refit every ~month (walk-forward step)
  min_train_days: 252
  cost_bps: 5
  threshold: 0.52           # long when P(up) >= threshold, else flat
  validation_years: 3

paper:                      # forward paper trading (no orders, ever)
  start_cash: 100000
  fill: open                # orders placed at a close fill at the next open | close
  exports_dir: exports

llm:                        # any OpenAI-compatible server on this machine
  url: http://localhost:11434/v1   # Ollama; llama-server: http://127.0.0.1:8080/v1
  model: llama3.2:3b
  temperature: 0.0
  timeout_s: 180
  retries: 2
  max_tokens: 400
  allow_remote: false       # a non-local URL is refused unless true

tuner:                      # weekly; only the live book can change
  min_improvement: 0.0005   # mean log loss must drop by MORE than this
  min_edge_t: 2.0           # ...and consistently: paired t across days >= this
  max_changes: 3            # settings changed per proposal
  max_tokens: 300
  bounds:
    threshold: [0.50, 0.60]
    train_days: [252, 1260]
    sentiment_weight: [0.0, 0.10]   # node A only (news)
    min_features_on: 2
    logistic: {C: [0.001, 10.0]}
    boosting: {max_depth: [2, 6], learning_rate: [0.01, 0.2],
               max_iter: [50, 500], min_samples_leaf: [50, 1000],
               l2_regularization: [0.0, 10.0]}

report:
  words: 150

schedule:                   # phase 7 — America/New_York
  timezone: America/New_York
  daily_at: "16:45"
  tune_weekday: 5           # Saturday
