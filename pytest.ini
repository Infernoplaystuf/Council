[pytest]
# Temp folders (%TEMP%\pytest-of-<user>\pytest-N) are deleted as soon as a test
# PASSES, and a whole run's folder at the end of a run that passed; only the
# folders of failing tests are kept, for the last 3 runs. Measured before this:
# 70 runs, 660 MB, because every passing test's output (a 4.75 MB Plotly page,
# 175 generated projects per emitter test) was kept.
#
# To keep everything for one debugging run:
#     pytest -o tmp_path_retention_policy=all ...
#
# NOT "none": with it pytest writes no lock file and, at exit, deletes every
# unlocked pytest-N folder — including those of other pytest runs still going
# on this machine (several sessions run the suite at once here; reproduced).
#
# This file also makes the repo root the rootdir wherever pytest is started,
# so node ids always read tests/test_x.py::name — started from inside tests/
# they used to be test_x.py::name, and a --deselect in that form no longer
# matches.
tmp_path_retention_policy = failed
tmp_path_retention_count = 3
#
# allow_ollama_port: tests/offline_guard.py refuses every connection to port
# 11434 - on a developer PC that is the REAL Ollama's. A test that puts its
# own fake server there opts in with this marker (or the fixture of the same
# name). Loopback only, as ever.
markers =
    allow_ollama_port: this test may connect to port 11434 (its own fake server there); see tests/offline_guard.py
